<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="UTUR (عطر), a Palestinian shop inspired by the groves and family table of Beit Ummar.">
  <meta name="theme-color" content="#263526">
  <title>UTUR عطر | Shop</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/shop.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-t="skip">Skip to content</a>
  <div class="announcement" data-t="announcement">From Palestine to the world</div>
  <header class="header">
    <nav class="wrap nav">
      <button id="header-menu" class="header-menu" type="button" aria-expanded="false" aria-controls="header-links language" data-t="menu">Menu</button>
      <div class="nav-links" id="header-links">
        <a href="/" data-t="home">Home</a>
        <a href="/shop/" data-t="shop" aria-current="page">Shop</a>
        <a href="/our-story/" data-t="story">Our story</a>
        <a href="/contact/" data-t="contact">Contact</a>
      </div>
      <a class="header-logo" href="/"><img src="/assets/utur-logo.webp" width="600" height="200" alt="UTUR · عطر فلسطين"></a>
      <div class="controls">
        <select id="language" aria-label="Language"><option value="en">English</option><option value="ar">العربية</option><option value="he">עברית</option><option value="it">Italiano</option><option value="de">Deutsch</option><option value="bs">Bosanski</option></select>
        <div class="header-actions">
          <a class="header-icon" href="/shop/?favorites" data-label="favorites" aria-label="Favorites"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 5.4a5.3 5.3 0 0 0-7.5 0L12 6.7l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.1a5.3 5.3 0 0 0 0-7.5Z"/></svg></a>
          <button class="header-icon" id="open-account" type="button" data-label="account" aria-label="Account"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM2.5 21a10 10 0 0 1 19 0"/></svg></button>
          <button class="header-icon" id="open-search" type="button" data-label="search" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0ZM16 16l6 6"/></svg></button>
          <button class="header-icon" id="open-cart" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14a2 2 0 0 1 2 1.8l1 9.8a2 2 0 0 1-2 2.2H4a2 2 0 0 1-2-2.2l1-9.8A2 2 0 0 1 5 8Zm2 0V6a5 5 0 0 1 10 0v2"/></svg><span class="sr-only" data-t="cart">Cart</span><span id="cart-count">0</span></button>
        </div>
      </div>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <section class="wrap collection" id="shop">
      <p class="eyebrow red" data-t="collection">THE UTUR COLLECTION</p>
      <h1 data-t="shopTitle">For your table and home</h1>
      <p class="sample" data-t="sample"></p>
      <p id="catalog-view" hidden><strong></strong> · <a href="/shop/" data-t="all">All products</a></p>
      <div id="filters" class="filters"></div>
      <p id="catalog-status" role="status"></p>
      <div id="products"></div>
    </section>
  </main>
  <footer><div class="wrap footer"><a class="brand" href="/">UTUR <small lang="ar">عطر</small></a><a href="/contact/" data-t="contact">Contact</a><span data-t="test">Test checkout · No real charges</span></div></footer>
  <dialog class="header-dialog" id="account-dialog" aria-labelledby="account-title">
    <div class="dialog-top"><h2 id="account-title" data-t="account">Account</h2><form method="dialog"><button type="submit" data-label="close" aria-label="Close">×</button></form></div>
    <p data-t="guestShopping">You can shop and check out as a guest.</p>
    <a href="/contact/" data-t="contact">Contact</a>
  </dialog>
  <dialog class="header-dialog" id="search-dialog" aria-labelledby="search-title">
    <div class="dialog-top"><h2 id="search-title" data-t="search">Search</h2><form method="dialog"><button type="submit" data-label="close" aria-label="Close">×</button></form></div>
    <form class="header-search" action="/shop/" role="search">
      <input autofocus name="q" type="search" required data-label="searchProducts" aria-label="Search products">
      <button type="submit" class="button" data-t="search">Search</button>
    </form>
  </dialog>
  <dialog id="cart" aria-labelledby="dialog-title">
    <div class="dialog-top"><h2 id="dialog-title" data-t="cart">Cart</h2><form method="dialog"><button id="close" aria-label="Close">×</button></form></div>
    <div id="cart-body"></div>
    <p id="checkout-status" role="status"></p>
  </dialog>
  <dialog id="product-details" aria-labelledby="product-details-title"></dialog>
  <p id="notice" class="sr-only" role="status"></p>
</body>
</html>
