<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="UTUR (عطر), a Palestinian shop inspired by the groves and family table of Beit Ummar.">
  <meta name="theme-color" content="#263526">
  <title>UTUR عطر | From Palestine to the world</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/shop.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-t="skip">Skip to content</a>
  <div class="announcement" data-t="announcement">From Palestine to the world</div>
  <header class="header">
    <nav class="wrap nav">
      <button id="header-menu" class="header-menu" type="button" aria-expanded="false" aria-controls="header-links language" data-t="menu">Menu</button>
      <div class="nav-links" id="header-links">
        <a href="/" data-t="home" aria-current="page">Home</a>
        <a href="/shop/" data-t="shop">Shop</a>
        <a href="/our-story/" data-t="story">Our story</a>
        <a href="/contact/" data-t="contact">Contact</a>
      </div>
      <a class="header-logo" href="/"><img src="/assets/utur-logo.webp" width="600" height="200" alt="UTUR · عطر فلسطين"></a>
      <div class="controls">
        <select id="language" aria-label="Language"><option value="en">English</option><option value="ar">العربية</option><option value="he">עברית</option><option value="it">Italiano</option><option value="de">Deutsch</option><option value="bs">Bosanski</option></select>
        <button id="open-cart" class="cart-button" type="button"><span class="cart-label" data-t="cart">Cart</span> <span id="cart-count">0</span></button>
      </div>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <section class="hero">
      <div class="wrap hero-content">
        <p class="eyebrow" data-t="origin">BEIT UMMAR, PALESTINE</p>
        <h1 data-t="headline">From Palestine<br>to the world.</h1>
        <p class="hero-copy" data-t="intro">Olive oil, pantry staples and gifts inspired by our family’s roots in Beit Ummar.</p>
        <a class="button butter" href="/shop/" data-t="browse">Shop the collection</a>
      </div>
    </section>
  </main>
  <footer><div class="wrap footer"><a class="brand" href="/">UTUR <small lang="ar">عطر</small></a><a href="/contact/" data-t="contact">Contact</a><span data-t="test">Test checkout · No real charges</span></div></footer>
  <dialog id="cart" aria-labelledby="dialog-title">
    <div class="dialog-top"><h2 id="dialog-title" data-t="cart">Cart</h2><form method="dialog"><button id="close" aria-label="Close">×</button></form></div>
    <div id="cart-body"></div>
    <p id="checkout-status" role="status"></p>
  </dialog>
  <p id="notice" class="sr-only" role="status"></p>
</body>
</html>
